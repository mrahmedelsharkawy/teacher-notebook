<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f2b27">
<title>منصة الشرقاوي التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c2723;--card:#263530;--card2:#2e403a;--line:#3a4f48;--ink:#f3efe3;--muted:#a3b3ac;--accent:#f2c75c;--ok:#6fcf97;--bad:#ee7b7b;--blue:#7db7f0;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));font-variant-numeric:lining-nums}
button,input,select,textarea{font:inherit;color:inherit}
#top{position:sticky;top:0;z-index:20;background:rgba(28,39,35,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:19px;color:var(--accent);letter-spacing:.2px}
.chip-user{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;max-width:60%}
.chip-user span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#1c2723;flex:none}
.av.big{width:52px;height:52px;font-size:22px}
main{max-width:860px;margin:0 auto;padding:16px}
h2{margin:6px 0 14px;font-size:20px}
h3{margin:22px 0 10px;font-size:16px;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid.g4{grid-template-columns:repeat(4,1fr)}.grid.g3{grid-template-columns:repeat(3,1fr)}.pgrid{grid-template-columns:repeat(2,1fr)!important}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .l{color:var(--muted);font-size:13px}
.stat .v{font-size:22px;font-weight:800;margin-top:4px}
.stat.hl .v{color:var(--accent)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.row.end{align-items:center;margin-top:10px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.pri{background:var(--accent);color:#1c2723;border-color:var(--accent);font-weight:700}
.btn.ok{color:var(--ok);border-color:#3f6b57}
.btn.bad{color:var(--bad);border-color:#7a4545}
.btn.block{width:100%;padding:12px}
.fab{position:fixed;left:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:15;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#1c2723;border:none;font-size:30px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer}
#nav{position:fixed;bottom:0;right:0;left:0;z-index:20;background:#17211e;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:none;padding:9px 2px 8px;color:var(--muted);cursor:pointer;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button i{font-style:normal;font-size:20px}
#nav button.on{color:var(--accent);font-weight:700}
.tag{font-size:12px;border-radius:999px;padding:3px 10px;white-space:nowrap;border:1px solid var(--line)}
.tag.scheduled{color:var(--blue);border-color:#3d5f80}.tag.done{color:var(--ok);border-color:#3f6b57}.tag.cancelled{color:var(--muted)}.tag.absent{color:var(--bad);border-color:#7a4545}.tag.pend{color:var(--accent);border-color:#8a7330}
.sess.cancelled{opacity:.6}
.topic{margin-top:4px;font-size:14px}
.price{font-weight:700;color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px}
.chips button.on{background:var(--accent);color:#1c2723;border-color:var(--accent);font-weight:700}
.date-h{margin:16px 0 8px;font-size:13.5px;color:var(--muted);font-weight:700}
input,select,textarea{width:100%;background:#1c2723;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line)}
@media(min-width:640px){#modal{align-items:center}.sheet{border-radius:22px}}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:4px}
.x{background:none;border:none;font-size:28px;color:var(--muted);cursor:pointer;line-height:1}
.pgrid{display:grid;grid-template-columns:1fr;gap:10px}
.pcard{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px}
.pcard.cur{border-color:var(--accent)}
.pcard .info{flex:1;min-width:0}
.pcard .info b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted)}
.bar div{width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.bar.cur div{background:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:18px}
.bal.pos{color:var(--bad)}.bal.neg{color:var(--ok)}
.hide{display:none!important}
#toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));right:50%;transform:translateX(50%);background:#000c;color:#fff;padding:10px 18px;border-radius:999px;z-index:60;opacity:0;transition:.25s;pointer-events:none;font-size:14px}
#toast.on{opacity:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12.5px}
a{color:var(--blue)}
.scard{padding:9px 12px;cursor:pointer;margin-bottom:8px}
.scard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scard .nm{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibs{display:flex;gap:5px;flex:none}
.ib{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:1}
.ib.bad{border-color:#7a4545}
.chips2{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.bx{font-size:12px;line-height:1.5;padding:1px 9px;border-radius:7px;border:1px solid;white-space:nowrap;width:fit-content}
.b-stage{color:#7db7f0;background:#7db7f01f;border-color:#7db7f055}
.b-grade{color:#c79cf0;background:#c79cf01f;border-color:#c79cf055}
.b-sub{color:#f2c75c;background:#f2c75c1f;border-color:#f2c75c55}
.b-in{color:#6fcf97;background:#6fcf971f;border-color:#6fcf9755}
.b-on{color:#8fe0d4;background:#8fe0d41f;border-color:#8fe0d455}
.b-price{color:#ee9b7b;background:#ee9b7b1f;border-color:#ee9b7b55}
.b-cnt{color:#a3b3ac;background:#a3b3ac1f;border-color:#a3b3ac55}
.b-due{color:#ee7b7b;background:#ee7b7b1f;border-color:#ee7b7b55}
.b-ok{color:#6fcf97;background:#6fcf971f;border-color:#6fcf9755}
.calbox{max-width:440px;margin:0 auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;direction:rtl}
.cal .h{font-size:11.5px;color:var(--muted);text-align:center;padding:2px 0}
.cd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;position:relative;background:#1c2723}
.cd.e{background:none}
.cd i{position:absolute;top:2px;left:5px;font-style:normal;font-size:10px;font-weight:700}
.cd.s-done{background:#6fcf97;color:#10221a;font-weight:800}
.cd.s-scheduled{background:#7db7f0;color:#0f1e2b;font-weight:800}
.cd.s-absent{background:#ee7b7b;color:#2b1010;font-weight:800}
.cd.s-cancelled{background:#4a5b55;color:#d6dfdb}
.cd[data-act]{cursor:pointer}
.cd.today{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:12px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}
details.mon{margin-bottom:8px}
details.mon summary{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:block}
details.mon summary b{font-size:15px;margin-left:8px}
details.mon summary .bx{margin-left:6px;display:inline-block;vertical-align:middle}
details.mon[open] summary{border-color:var(--accent);margin-bottom:8px}
details.mon[open] summary b{color:var(--accent)}
details.arch{margin-top:16px}
details.arch summary{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-weight:700;margin-bottom:10px;color:var(--muted)}
details.arch[open] summary{color:var(--accent)}

/* Notifications */
#top{position:relative}
.notify-btn{position:absolute;left:22px;top:16px;z-index:4;width:42px;height:42px;border:1px solid #b99a56;border-radius:13px;background:#173b34;color:#f6bd4b;font-size:21px;cursor:pointer;display:grid;place-items:center}
.notify-btn .notify-count{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:20px;background:#df5548;color:#fff;font:700 11px Arial;display:grid;place-items:center}
.notify-btn.quiet .notify-count{display:none}
.notify-panel{position:absolute;left:18px;top:64px;z-index:50;width:min(340px,calc(100vw - 36px));max-height: min(60vh,420px);overflow:auto;background:#102b29;border:1px solid #b99a56;border-radius:14px;padding:12px;box-shadow:0 14px 35px #0009;color:#f4f8f5}
.notify-panel h4{margin:2px 4px 10px;color:#f6bd4b}.notify-item{padding:10px;border-bottom:1px solid #28514b;font-size:13px}.notify-item:last-child{border:0}.notify-item b{display:block;margin-bottom:4px}.notify-empty{padding:12px;text-align:center;color:#a8c1b9;font-size:13px}
/* Global premium header and floating navigation */
#top{position:sticky;top:0;z-index:30;min-height:116px;padding:10px 18px;display:grid;grid-template-columns:1fr 1.2fr;direction:rtl;gap:12px;background:linear-gradient(135deg,rgba(19,31,27,.97),rgba(36,54,47,.95));box-shadow:0 8px 28px rgba(0,0,0,.2);overflow:visible}
.global-person{display:flex;align-items:center;justify-content:flex-start;gap:12px;min-width:0;position:relative;height:100%;align-self:center}
.global-person img{height:168px;width:auto;max-width:48%;object-fit:contain;object-position:center top;align-self:end;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3));margin-top:-12px}
.global-person .brand{font-size:18px;line-height:1.4}
.global-clock{direction:ltr;display:flex;align-items:center;justify-content:flex-start;gap:14px;min-width:0}
.global-date{direction:rtl;text-align:right}
.global-date .date-label{font-size:12px;color:var(--muted);margin-bottom:5px}
.global-date .date-value{font-size:16px;font-weight:800;color:var(--ink)}
.global-date .date-sub{font-size:12px;color:var(--accent);margin-top:4px}
.clock-display{flex:none;width:104px;height:104px;min-width:104px;position:relative;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 45%,#183b34 0%,#0b211e 72%,#071714 100%);border:2px solid #c7a65c;box-shadow:0 0 0 4px rgba(199,166,92,.13),0 7px 20px #0008,inset 0 0 12px #0008;direction:ltr}
.clock-display svg{display:block;width:100%;height:100%;overflow:visible}.clock-display .hand{transform-box:view-box;transform-origin:50px 50px;stroke-linecap:round}.clock-display .hour-hand{stroke:#f8f0d8;stroke-width:4.2}.clock-display .minute-hand{stroke:#f4c45e;stroke-width:2.8}.clock-display .second-hand{stroke:#e77d70;stroke-width:1.25}.clock-display .clock-pin{fill:#f4c45e;stroke:#102a25;stroke-width:1.5}
#nav{right:50%;left:auto;transform:translateX(50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(620px,calc(100% - 24px));border:1px solid #62756a;border-radius:22px;padding:4px;background:rgba(19,30,26,.94);backdrop-filter:blur(18px);box-shadow:0 8px 30px #0007;overflow:hidden}
#nav button{border-radius:16px;padding:8px 2px 7px;font-size:11px}
#nav button.on{background:#34483e;color:var(--accent)}
body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.fab{bottom:calc(98px + env(safe-area-inset-bottom))}
.calendar-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calendar-head strong{color:var(--accent)}
.calendar-switch{display:flex;gap:5px;flex-wrap:wrap}
.calendar-switch button,.cal-nav{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12px}
.calendar-switch button.on{background:var(--accent);color:#1c2723;border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-weekday{text-align:center;color:var(--muted);font-size:11px;padding:4px 0}
.cal-day{min-height:58px;padding:5px 2px;text-align:center;border:1px solid var(--line);border-radius:8px;background:#202f29;font-size:12px;cursor:pointer;overflow:hidden}
.cal-day.muted-day{opacity:.35}
.cal-day.today-day{border-color:var(--accent)}
.cal-day.selected-day{background:#3d5346;box-shadow:inset 0 0 0 1px var(--accent)}
.cal-day .cal-count{display:block;margin:4px auto 0;background:var(--accent);color:#17211e;border-radius:99px;min-width:18px;width:max-content;padding:1px 5px;font-size:10px;font-weight:800}
.day-list{display:grid;gap:7px}
.day-event{border-right:3px solid var(--accent);background:#202f29;padding:9px 10px;border-radius:8px}
.day-event b{font-size:13px}.day-event small{color:var(--muted);display:block;margin-top:3px}
@media(max-width:520px){#top{min-height:98px;padding:8px 10px;gap:5px}.global-person img{height:132px;margin-top:-5px;max-width:46%}.global-person .brand{font-size:15px}.global-clock{gap:7px}.clock-display{width:82px;height:82px;min-width:82px}.global-date .date-value{font-size:13px}.global-date .date-sub{font-size:10px}.global-date .date-label{font-size:10px}.cal-day{min-height:48px;font-size:11px}}


/* ===== Premium teal & gold redesign ===== */
:root{--bg:#071d1b;--card:#102b29;--card2:#173936;--line:#28514b;--ink:#f4f8f5;--muted:#a8c1b9;--accent:#f6bd4b;--ok:#55d6a0;--bad:#ff806e;--blue:#65b8f2;--r:17px}
body{background:radial-gradient(ellipse at 50% -20%,#16413b 0%,#071d1b 56%,#061715 100%);color:var(--ink)}
main{max-width:1220px;padding:22px 24px 36px}
h2{font-size:23px;font-weight:800;color:#f7f7ee;margin:8px 0 18px}
h3{color:var(--accent)}
#top{min-height:164px;padding:8px 30px 0;background:linear-gradient(110deg,#061916 0%,#0b2825 55%,#123a34 100%);border-bottom:1px solid #2c655b;box-shadow:0 12px 36px #0005}
.global-person img{height:138px;max-width:42%;width:auto;object-fit:contain;object-position:center center;align-self:center;margin-top:0;filter:drop-shadow(0 10px 14px #0008)}
.global-person .brand{font-size:24px;color:#fff}
.global-person .muted{color:#b6cec5!important;font-size:14px}
.global-clock{gap:20px}
.clock-display{width:112px;height:112px;min-width:112px}
.global-date .date-value{font-size:19px;color:#fff}
.global-date .date-sub{font-size:14px;color:var(--accent)}
.card,.stat,.pcard,.calendar-panel,details.mon summary,details.arch summary{background:linear-gradient(145deg,#112e2b,#0d2523);border-color:#28534c;box-shadow:0 6px 18px #0002}
.stat{padding:17px 18px;min-height:92px}
.stat .l{color:#aac2b9}.stat .v{font-size:25px;color:#fff}
.stat.hl{border-color:#b58c3c}
.stat.hl .v{color:var(--accent)}
.btn{background:#173936;border-color:#315e55;border-radius:11px;color:#eaf4ef}

.btn.bad{color:#ff8d82;border-color:#8c4b48}
.chips button,.calendar-switch button,.cal-nav{background:#12312e;border-color:#315b53;color:#dceae4}
.chips button.on,.calendar-switch button.on{background:var(--accent);color:#17231d;border-color:var(--accent)}
input,select,textarea{background:#0a211f;border-color:#31574f;color:#f4f8f5}
.sess{border-right:4px solid #4fbf98}

#nav{bottom:calc(24px + env(safe-area-inset-bottom));width:min(590px,calc(100% - 48px));background:rgba(7,29,27,.94);border:1px solid #32635a;border-radius:24px;padding:3px 5px;box-shadow:0 12px 38px #0009}
#nav button{font-size:11px;padding:6px 1px;border-radius:16px;color:#a8c1b9;min-width:0;gap:2px}
#nav button i{font-size:17px}
#nav button.on{background:linear-gradient(180deg,#234940,#16342f);color:var(--accent)}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.fab{background:linear-gradient(135deg,#ffd16b,#e8a52b);box-shadow:0 8px 24px #0008}
.calendar-panel{padding:17px}
.cal-day{background:#0b2522;border-color:#28534c;color:#f3f8f4;min-height:62px}

 main{padding:15px 12px 28px}
 #top{min-height:128px;padding:5px 12px 0;grid-template-columns:1fr 1fr}

 .global-person .brand{font-size:17px}

/* ===== Header refinement v8 ===== */

<script>
/* ======== إعدادات مؤقتة (للمعاينة) ========
   SKIP_LOGIN=true : يتجاوز شرط إنشاء مستخدم ويدخل مباشرة بمستخدم تجريبي
   SEED_DEMO=true  : يملأ المستخدم التجريبي ببيانات نموذجية
   اجعلهما false لإعادة السلوك الأصلي */
const SKIP_LOGIN=true,SEED_DEMO=true;

/* ======== أدوات عامة ======== */
const $=s=>document.querySelector(s);
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const ST={scheduled:'مجدولة',done:'تمت',cancelled:'ملغاة',absent:'غاب الطالب'};
const STAGES=['ابتدائي','متوسط','ثانوي','جامعي'];
const GRADES={
  'ابتدائي':['الأول','الثاني','الثالث','الرابع','الخامس','السادس'],
  'متوسط':['الأول المتوسط','الثاني المتوسط','الثالث المتوسط'],
  'ثانوي':['الأول الثانوي','الثاني الثانوي','الثالث الثانوي','خريج'],
  'جامعي':['السنة التحضيرية','السنة الأولى','السنة الثانية','السنة الثالثة','السنة الرابعة','السنة الخامسة']
};
const LTYPES=['حضوري','أونلاين'];
const SUBJECTS=['منهج','قدرات','تحصيلي','GAT','SAAT'];
const RELS=['أب','أم','أخ','أخت'];
const gradeOptions=(stage,sel)=>{const l=(GRADES[stage]||[]).slice();if(sel&&!l.includes(sel))l.unshift(sel);return `<option value="">— اختر —</option>`+l.map(g=>`<option ${g===sel?'selected':''}>${esc(g)}</option>`).join('')};
const opts=(arr,sel)=>arr.map(o=>`<option ${o===sel?'selected':''}>${esc(o)}</option>`).join('');
const addrLine=s=>[s.district&&'حي '+s.district,s.building&&'مبنى '+s.building,s.floor&&'الدور '+s.floor,s.apt&&'شقة '+s.apt].filter(Boolean).join(' · ');
const COLORS=['#f2c75c','#7db7f0','#6fcf97','#ee9b7b','#c79cf0','#f08fb5','#8fe0d4','#d9d06f'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmtDate=s=>{const d=parse(s);return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`};
const fmtTime=t=>{if(!t)return'';let [h,m]=t.split(':').map(Number);const p=h>=12?'م':'ص';h=h%12||12;return `${h}:${pad(m)} ${p}`};
const shiftMonth=(m,n)=>{let [y,mo]=m.split('-').map(Number);mo+=n-1;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+pad(mo+1)};
const monthLabel=m=>{const [y,mo]=m.split('-').map(Number);return `${MONTHS[mo-1]} ${y}`};
const num=v=>{const n=Number(String(v??'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[٫,]/g,'.').trim());return isFinite(n)?n:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const byTime=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
const ls={
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){if(!ls.w){ls.w=1;toast('التخزين غير متاح هنا — البيانات مؤقتة لهذه الجلسة')}return false}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}

/* ======== الحالة والتخزين (بيانات كل مستخدم في مفتاح مستقل) ======== */
const K_USERS='tl_users',K_CUR='tl_current',dataKey=id=>'tl_data_'+id;
let users=[],curId=null,db=null;
const S={view:'dash',studentId:null,month:today().slice(0,7),sFilter:'upcoming',sStudent:'',archOpen:false,mOpen:{},calMonth:today().slice(0,7),calMode:'month',calDate:today()};
const emptyDb=()=>({students:[],sessions:[],payments:[]});
function loadData(id){try{const d=JSON.parse(ls.get(dataKey(id))||'null');return d&&d.students?d:emptyDb()}catch(e){return emptyDb()}}
function demoData(){
  const t=today(),base={stage:'ثانوي',ltype:'حضوري',rel:'أب'};
  const students=[
    {...base,id:'d1',name:'سلمان العتيبي',grade:'الثالث الثانوي',subject:'قدرات',price:120,phone:'0500000001',parentPhone:'0500000002',district:'الروضة',building:'12',floor:'2',apt:'4',location:'https://maps.google.com',notes:''},
    {...base,id:'d2',name:'ريم القحطاني',grade:'الثاني الثانوي',ltype:'أونلاين',subject:'منهج',price:100,phone:'0500000003',rel:'أم',parentPhone:'0500000004'},
    {...base,id:'d3',name:'فهد الشمري',stage:'متوسط',grade:'الثالث المتوسط',subject:'منهج',price:80,phone:'0500000005',parentPhone:'0500000006',district:'الصفا',building:'7',floor:'1',apt:'2'}
  ];
  const sessions=[];
  for(let i=0;i<18;i++){
    const off=-26+i*2,s=students[i%3],d=addDays(t,off);
    const status=off<0?(i%7===3?'absent':i%9===5?'cancelled':'done'):'scheduled';
    sessions.push({id:'ds'+i,studentId:s.id,date:d,time:['16:00','17:30','19:00'][i%3],duration:60,price:s.price,topic:['التفاضل','النهايات','النسب والتناسب'][i%3],status});
  }
  sessions.push({id:'dt',studentId:'d1',date:t,time:'18:00',duration:90,price:150,topic:'تدريب قدرات',status:'scheduled'});
  const payments=[
    {id:'dp1',studentId:'d1',amount:360,date:addDays(t,-15),method:'نقدًا',note:''},
    {id:'dp2',studentId:'d2',amount:300,date:addDays(t,-9),method:'تحويل بنكي',note:''},
    {id:'dp3',studentId:'d3',amount:160,date:addDays(t,-4),method:'نقدًا',note:''}
  ];
  return{students,sessions,payments};
}
function init(){
  try{users=JSON.parse(ls.get(K_USERS)||'[]')}catch(e){users=[]}
  curId=ls.get(K_CUR);
  if(!users.find(u=>u.id===curId))curId=null;
  if(SKIP_LOGIN){
    if(!users.length){const u={id:'demo',name:'مستخدم تجريبي',currency:'ر.س',color:COLORS[0]};users.push(u);curId=u.id;db=SEED_DEMO?demoData():emptyDb();saveUsers();ls.set(K_CUR,curId);save()}
    else if(!curId){curId=users[0].id;ls.set(K_CUR,curId)}
  }
  if(curId&&!db)db=loadData(curId);
  S.view=curId?'dash':'profiles';
  render();
  if(!users.length)openUserForm();
}
const saveUsers=()=>ls.set(K_USERS,JSON.stringify(users));
const save=()=>ls.set(dataKey(curId),JSON.stringify(db));
const cur=()=>users.find(u=>u.id===curId)||{name:'',currency:''};
const stu=id=>db.students.find(s=>s.id===id);
const money=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})+' '+(cur().currency||'');

function stats(id){
  const charged=db.sessions.filter(x=>x.studentId===id&&x.status==='done').reduce((a,x)=>a+num(x.price),0);
  const paid=db.payments.filter(p=>p.studentId===id).reduce((a,p)=>a+num(p.amount),0);
  const count=db.sessions.filter(x=>x.studentId===id&&x.status==='done').length;
  return{charged,paid,balance:charged-paid,count};
}
const sumPaid=m=>db.payments.filter(p=>p.date.slice(0,7)===m).reduce((a,p)=>a+num(p.amount),0);
const sumCharged=m=>db.sessions.filter(x=>x.status==='done'&&x.date.slice(0,7)===m).reduce((a,x)=>a+num(x.price),0);


function updateGlobalClock(){
 const d=new Date(),date=$('#globalDate'),time=$('#globalTime'),clock=$('#globalClockTime');
 const weekday=d.toLocaleDateString('ar-EG',{weekday:'long'});
 const dateText=d.toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
 const label=$('.global-date .date-label');
 if(label)label.textContent=weekday;
 if(date)date.textContent=dateText;
 if(time)time.textContent=d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
 if(clock){
  const sec=d.getSeconds(),min=d.getMinutes(),hr=d.getHours()%12;
  const set=(id,deg)=>{const el=clock.querySelector('#'+id);if(el)el.style.transform=`rotate(${deg}deg)`;};
  set('clockHour',hr*30+min*.5);set('clockMinute',min*6+sec*.1);set('clockSecond',sec*6);
 }

}
setInterval(updateGlobalClock,1000);
setInterval(()=>{const b=document.querySelector('.notify-btn'),n=b?.querySelector('.notify-count');if(!b||!n)return;const count=overdueSessions().length;n.textContent=count;b.classList.toggle('quiet',!count)},15000);
/* الحصص التي انتهى موعدها ولم تسجل حالتها */
function overdueSessions(){
 const now=new Date();
 return (db?.sessions||[]).filter(x=>x.status==='scheduled' && new Date(`${x.date}T${x.time||'00:00'}:00`) < now).sort((a,b)=>new Date(`${a.date}T${a.time||'00:00'}:00`)-new Date(`${b.date}T${b.time||'00:00'}:00`));
}
function openNotifications(){
 const items=overdueSessions();
 const body=items.length?items.map(x=>{const s=stu(x.studentId);return `<div class="notify-item"><b>${esc(s?.name||'طالب')} · ${fmtDate(x.date)} · ${fmtTime(x.time)}</b><span>${esc(x.topic||'حصة')} — لم تُحدد الحالة بعد</span><div style="margin-top:8px"><button class="btn sm" data-act="editSession" data-id="${x.id}">تحديد الحالة</button></div></div>`}).join(''):'<div class="notify-empty">لا توجد حصص متأخرة دون تحديد الحالة</div>';
 modal('الإشعارات',`<div>${items.length?`<div class="muted" style="margin-bottom:8px">لديك ${items.length} حصة انتهى موعدها وتنتظر تحديد الحالة</div>`:''}${body}</div>`);
}

function sessCard(x,showStu=true){
  const s=stu(x.studentId),late=x.status==='scheduled'&&x.date<today();
  return `<div class="card sess ${x.status}">
   <div class="row"><div><b>${showStu?esc(s?s.name:'—'):fmtDate(x.date)}</b>
    <div class="muted">${showStu?fmtDate(x.date)+' · ':''}${fmtTime(x.time)} · ${x.duration} دقيقة</div>
    ${x.topic?`<div class="topic">${esc(x.topic)}</div>`:''}</div>
    <div class="tag ${late?'pend':x.status}">${late?'بانتظار التأكيد':ST[x.status]}</div></div>
   <div class="row end"><span class="price">${money(x.price)}</span>
    <div class="btns">
     ${x.status!=='done'?`<button class="btn sm ok" data-act="setStatus" data-id="${x.id}" data-s="done">تمت</button>`:''}
     ${x.status==='scheduled'?`<button class="btn sm" data-act="setStatus" data-id="${x.id}" data-s="absent">غاب</button><button class="btn sm" data-act="setStatus" data-id="${x.id}" data-s="cancelled">إلغاء</button>`:''}
     ${x.status!=='scheduled'?`<button class="btn sm" data-act="setStatus" data-id="${x.id}" data-s="scheduled">إعادة جدولة</button>`:''}
     <button class="btn sm" data-act="editSession" data-id="${x.id}">تعديل</button>
     <button class="btn sm bad" data-act="delSession" data-id="${x.id}">حذف</button>
    </div></div></div>`;
}

function dd(key,title,count,body,def=true,extra=''){
  const open=key in S.mOpen?S.mOpen[key]:def;
  return `<details class="mon" data-mk="${esc(key)}" ${open?'open':''}><summary><b>${title}</b>${count!=null?`<span class="bx b-stage">${count}</span>`:''}${extra}</summary>${body}</details>`;
}
function monthGroups(list,dateOf,key,bodyFn,unit,sumFn){
  const order=[],g={};
  list.forEach(x=>{const m=dateOf(x).slice(0,7);if(!g[m]){g[m]=[];order.push(m)}g[m].push(x)});
  return order.map((m,i)=>{const l=g[m];return dd(key+'|'+m,monthLabel(m),l.length+' '+unit,bodyFn(l),i===0,sumFn?sumFn(l):'')}).join('');
}
const sessSum=l=>{const d=l.filter(x=>x.status==='done');return d.length?`<span class="bx b-ok">منجزة ${d.length} · ${money(d.reduce((a,x)=>a+num(x.price),0))}</span>`:''};
function viewDash(){
  const t=today(),m=t.slice(0,7);
  const todays=db.sessions.filter(x=>x.date===t&&x.status!=='cancelled').sort(byTime);
  const next=db.sessions.filter(x=>x.date>t&&x.date<=addDays(t,7)&&x.status==='scheduled').sort(byTime);
  const pending=db.sessions.filter(x=>x.status==='scheduled'&&x.date<t).length;
  const dues=db.students.map(s=>({s,b:stats(s.id).balance})).filter(o=>o.b>0).sort((a,b)=>b.b-a.b);
  const totalDues=dues.reduce((a,o)=>a+o.b,0);
  const active=db.students.filter(s=>!isArch(s)).length;
  const tiles=`<div class="grid g4">
   <div class="stat hl"><div class="l">دخل ${monthLabel(m)}</div><div class="v">${money(sumPaid(m))}</div></div>
   <div class="stat"><div class="l">حصص منجزة هذا الشهر</div><div class="v">${db.sessions.filter(x=>x.status==='done'&&x.date.slice(0,7)===m).length}</div></div>
   <div class="stat"><div class="l">مستحقات غير مسددة</div><div class="v">${money(totalDues)}</div></div>
   <div class="stat"><div class="l">الطلاب النشطون</div><div class="v">${active}</div></div>
  </div>`;
  return `<h2>أهلاً ${esc(cur().name)} 👋</h2><div class="muted" style="margin:-8px 0 14px">${fmtDate(t)}</div>
  ${dd('dash|sum','ملخص '+monthLabel(m),null,tiles)}
  ${pending?`<div class="card" style="border-color:#8a7330"><div class="row end" style="margin:0"><span>لديك ${pending} حصة سابقة تحتاج تأكيد الحالة</span><button class="btn sm" data-act="pendingList">عرضها</button></div></div>`:''}
  ${dd('dash|today','حصص اليوم',todays.length+' حصة',todays.map(x=>sessCard(x)).join('')||`<div class="card empty">لا توجد حصص اليوم</div>`)}
  ${dd('dash|next','القادم خلال 7 أيام',next.length+' حصة',next.map(x=>sessCard(x)).join('')||`<div class="card empty">لا توجد حصص قادمة</div>`)}
  ${dues.length?dd('dash|dues','أعلى المستحقات',dues.length+' طالب',dues.slice(0,5).map(o=>`<div class="card row end" style="margin-bottom:8px;cursor:pointer" data-act="openStudent" data-id="${o.s.id}"><b>${esc(o.s.name)}</b><span class="bal pos">${money(o.b)}</span></div>`).join(''),false):''}
  <button class="fab" data-act="addSession" title="حصة جديدة">+</button>`;
}


function sessionCalendar(){
 const base=new Date((S.calDate||today())+'T12:00:00');
 const all=db.sessions.filter(x=>!S.sStudent||x.studentId===S.sStudent);
 const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 let days=[];
 if(S.calMode==='day') days=[new Date(base)];
 else if(S.calMode==='week'){const start=new Date(base);start.setDate(start.getDate()-start.getDay());days=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d})}
 else {const start=new Date(base.getFullYear(),base.getMonth(),1);start.setDate(start.getDate()-start.getDay());days=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d})}
 const title=S.calMode==='month'?base.toLocaleDateString('ar-EG',{month:'long',year:'numeric'}):S.calMode==='week'?`أسبوع ${days[0].toLocaleDateString('ar-EG',{day:'numeric',month:'short'})} – ${days[6].toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}`:base.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
 const events=day=>all.filter(x=>x.date===dateKey(day)).sort(byTime);
 const grid=S.calMode==='day'?`<div class="day-list">${events(base).map(x=>`<div class="day-event"><b>${esc((stu(x.studentId)||{}).name||'—')} · ${fmtTime(x.time)}</b><small>${esc(x.topic||'حصة')} · ${ST[x.status]||''}</small></div>`).join('')||'<div class="muted">لا توجد حصص في هذا اليوم</div>'}</div>`:
 S.calMode==='week'?`<div class="day-list">${days.map(d=>`<div><div class="muted" style="margin:4px 0">${d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'short'})}</div>${events(d).map(x=>`<div class="day-event"><b>${fmtTime(x.time)} · ${esc((stu(x.studentId)||{}).name||'—')}</b><small>${esc(x.topic||'حصة')} · ${ST[x.status]||''}</small></div>`).join('')||'<div class="muted" style="padding:3px 8px">لا توجد حصص</div>'}</div>`).join('')}</div>`:
 `<div class="cal-grid">${DAYS.map(d=>`<div class="cal-weekday">${d.slice(0,3)}</div>`).join('')}${days.map(d=>{const k=dateKey(d),n=events(d).length;return `<button class="cal-day ${d.getMonth()!==base.getMonth()?'muted-day':''} ${k===today()?'today-day':''} ${k===S.calDate?'selected-day':''}" data-act="calPick" data-v="${k}">${d.getDate()}${n?`<span class="cal-count">${n}</span>`:''}</button>`}).join('')}</div><div class="muted" style="margin-top:8px">اضغط على أي يوم لعرض حصصه.</div>`;
 return `<section class="calendar-panel"><div class="calendar-head"><strong>تقويم الحصص</strong><div class="btns"><button class="cal-nav" data-act="calShift" data-n="-1">‹</button><span style="font-size:12px">${title}</span><button class="cal-nav" data-act="calShift" data-n="1">›</button></div></div><div class="calendar-switch">${[['day','يومي'],['week','أسبوعي'],['month','شهري']].map(([v,l])=>`<button class="${S.calMode===v?'on':''}" data-act="calMode" data-v="${v}">${l}</button>`).join('')}<button data-act="calToday">اليوم</button></div><div style="margin-top:10px">${grid}</div></section>`;
}

function viewSessions(){
  const t=today();let list=db.sessions.slice();
  if(S.sStudent)list=list.filter(x=>x.studentId===S.sStudent);
  const pendingN=list.filter(x=>x.status==='scheduled'&&x.date<t).length;
  const F={upcoming:x=>x.date>=t&&x.status==='scheduled',today:x=>x.date===t,pending:x=>x.status==='scheduled'&&x.date<t,past:x=>x.date<t,all:()=>true};
  list=list.filter(F[S.sFilter]||F.all);
  list.sort(S.sFilter==='upcoming'?byTime:(a,b)=>byTime(b,a));
  const html=monthGroups(list,x=>x.date,'sl|'+S.sFilter+'|'+S.sStudent,l=>{let last='',h='';l.forEach(x=>{if(x.date!==last){last=x.date;h+=`<div class="date-h">${fmtDate(x.date)}${x.date===t?' — اليوم':''}</div>`}h+=sessCard(x)});return h},'حصة',sessSum);
  const archived=db.sessions.filter(x=>x.date<t&&(!S.sStudent||x.studentId===S.sStudent)).sort((a,b)=>byTime(b,a));
  const archiveBody=archived.length
    ? monthGroups(archived,x=>x.date,'session-archive|'+S.sStudent,l=>{let last='',h='';l.forEach(x=>{if(x.date!==last){last=x.date;h+=`<div class="date-h">${fmtDate(x.date)}</div>`}h+=sessCard(x)});return h},'حصة',sessSum)
    : `<div class="card empty">لا توجد حصص سابقة في الأرشيف</div>`;
  const chips=[['upcoming','القادمة'],['today','اليوم'],['pending','بحاجة لتأكيد'+(pendingN?` (${pendingN})`:'')],['past','السابقة'],['all','الكل']];
  return `<h2>الحصص والمواعيد</h2>
  ${sessionCalendar()}\n  <div class="chips">${chips.map(([k,l])=>`<button class="${S.sFilter===k?'on':''}" data-act="filter" data-v="${k}">${l}</button>`).join('')}</div>
  <select data-act-change="sStudent" style="margin-bottom:10px"><option value="">كل الطلاب</option>${db.students.map(s=>`<option value="${s.id}" ${S.sStudent===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
  ${html||`<div class="card empty">لا توجد حصص في هذا العرض</div>`}
  <details class="arch" id="sessionArchive">
    <summary>📦 أرشيف الحصص السابقة <span class="bx b-stage">${archived.length} حصة</span></summary>
    ${archiveBody}
  </details>
  <button class="fab" data-act="addSession">+</button>`;
}

const isArch=s=>!!s.archived||s.active===false;
function stuCard(s){
  const st=stats(s.id),arch=isArch(s);
  const bx=(c,t)=>t?`<span class="bx ${c}">${esc(t)}</span>`:'';
  const bal=st.balance>0?`<span class="bx b-due">عليه ${money(st.balance)}</span>`:st.balance<0?`<span class="bx b-ok">له ${money(-st.balance)}</span>`:`<span class="bx b-ok">مسدد</span>`;
  return `<div class="card scard" data-act="openStudent" data-id="${s.id}" data-name="${esc(s.name)}">
   <div class="top"><span class="nm">${esc(s.name)}</span>
    <span class="ibs"><button class="ib" title="تعديل" data-act="editStudent" data-id="${s.id}">✏️</button><button class="ib bad" title="حذف" data-act="delStudent" data-id="${s.id}">🗑️</button><button class="ib" title="${arch?'استرجاع من الأرشيف':'أرشفة'}" data-act="archiveStudent" data-id="${s.id}">${arch?'↩️':'📦'}</button><button class="ib" title="تقرير الطالب" data-act="report" data-id="${s.id}">📄</button></span></div>
   <div class="chips2">${bx('b-stage',s.stage)}${bx('b-grade',s.grade)}${bx('b-sub',s.subject)}${bx(s.ltype==='أونلاين'?'b-on':'b-in',s.ltype)}${bx('b-price',s.price?money(s.price):'')}${bx('b-cnt',st.count+' حصة')}${bal}</div></div>`;
}
function viewStudents(){
  const sorted=db.students.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const act=sorted.filter(s=>!isArch(s)),ar=sorted.filter(isArch);
  return `<h2>الطلاب</h2>
  ${db.students.length>4?`<input id="q" placeholder="بحث بالاسم..." style="margin-bottom:12px">`:''}
  ${dd('stu|act','الطلاب النشطون',act.length+' طالب',`<div id="slist">${act.map(stuCard).join('')||`<div class="card empty">${ar.length?'لا يوجد طلاب نشطون':'لم تضف أي طالب بعد.<br>اضغط + لإضافة أول طالب.'}</div>`}</div>`)}
  ${dd('stu|arch','أرشيف الطلاب',ar.length+' طالب',`<div id="alist">${ar.map(stuCard).join('')||`<div class="muted" style="padding:6px 4px">الأرشيف فارغ</div>`}</div>`,false)}
  <button class="fab" data-act="addStudent">+</button>`;
}

function calHtml(sid){
  const m=S.calMonth,[y,mo]=m.split('-').map(Number);
  const lead=new Date(y,mo-1,1).getDay(),dim=new Date(y,mo,0).getDate(),t=today();
  const by={};db.sessions.filter(x=>x.studentId===sid&&x.date.slice(0,7)===m).forEach(x=>{(by[x.date]=by[x.date]||[]).push(x)});
  const pr=['done','absent','scheduled','cancelled'];
  let cells=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'].map(n=>`<div class="h">${n}</div>`).join('');
  for(let i=0;i<lead;i++)cells+='<div class="cd e"></div>';
  for(let d=1;d<=dim;d++){
    const ds=`${m}-${pad(d)}`,l=by[ds];let cls='cd';
    if(l)cls+=' s-'+pr.find(p=>l.some(x=>x.status===p));
    if(ds===t)cls+=' today';
    cells+=`<div class="${cls}" ${l?`data-act="calDay" data-d="${ds}" title="${l.length} حصة"`:''}>${d}${l&&l.length>1?`<i>${l.length}</i>`:''}</div>`;
  }
  const n=Object.values(by).reduce((a,l)=>a+l.length,0);
  const dot=(c,l)=>`<span><span class="dot" style="background:${c}"></span>${l}</span>`;
  return `<div class="card calbox"><div class="mnav"><button class="btn sm" data-act="calNav" data-n="-1">→</button><b>${monthLabel(m)}</b><button class="btn sm" data-act="calNav" data-n="1">←</button></div>
   <div class="cal">${cells}</div>
   <div class="muted" style="text-align:center;margin-top:10px">${Object.keys(by).length} يوم · ${n} حصة في هذا الشهر</div>
   <div class="legend">${dot('#6fcf97','منجزة')}${dot('#7db7f0','مجدولة')}${dot('#ee7b7b','غاب')}${dot('#4a5b55','ملغاة')}</div></div>`;
}
function sessByMonth(sess,sid){
  if(!sess.length)return `<div class="card empty">لا توجد حصص</div>`;
  return monthGroups(sess,x=>x.date,sid,l=>l.map(x=>sessCard(x,false)).join(''),'حصة',sessSum);
}
function viewStudent(id){
  const s=stu(id),st=stats(id);
  const sess=db.sessions.filter(x=>x.studentId===id).sort((a,b)=>byTime(b,a));
  const pays=db.payments.filter(p=>p.studentId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const info=`<div class="card"><div class="row"><div><h2 style="margin:0">${esc(s.name)}</h2>
   <div class="muted" style="margin-top:4px">${[s.stage,s.grade].filter(Boolean).map(esc).join(' - ')}</div>
   <div class="muted">${[s.subject,s.ltype].filter(Boolean).map(esc).join(' · ')}</div>
   ${s.phone?`<div style="margin-top:6px">📞 <a href="tel:${esc(s.phone)}">${esc(s.phone)}</a></div>`:''}
   ${s.parentPhone?`<div>👪 ${esc(s.rel||'ولي الأمر')}: <a href="tel:${esc(s.parentPhone)}">${esc(s.parentPhone)}</a></div>`:''}
   ${s.ltype!=='أونلاين'&&(addrLine(s)||s.location)?`<div style="margin-top:6px">📍 ${esc(addrLine(s))}${s.location?` ${/^https?:\/\//i.test(s.location)?`<a href="${esc(s.location)}" target="_blank" rel="noopener">فتح الخريطة</a>`:esc(s.location)}`:''}</div>`:''}
   <div class="muted" style="margin-top:6px">سعر الحصة: ${money(s.price)}</div>
   ${s.notes?`<div style="margin-top:8px">${esc(s.notes)}</div>`:''}</div>
   <div class="btns"><button class="btn sm" data-act="editStudent" data-id="${id}">تعديل</button><button class="btn sm" data-act="archiveStudent" data-id="${id}">${isArch(s)?'استرجاع':'أرشفة'}</button><button class="btn sm bad" data-act="delStudent" data-id="${id}">حذف</button></div></div></div>`;
  const fin=`<div class="grid g3"><div class="stat"><div class="l">إجمالي الحصص المنجزة</div><div class="v">${money(st.charged)}</div></div>
   <div class="stat"><div class="l">المدفوع</div><div class="v">${money(st.paid)}</div></div>
   <div class="stat hl"><div class="l">${st.balance<0?'رصيد له':'المتبقي عليه'}</div><div class="v bal ${st.balance>0?'pos':'neg'}">${money(Math.abs(st.balance))}</div></div></div>`;
  const payBody=pays.length?monthGroups(pays,p=>p.date,'pm|'+id,l=>l.map(p=>payRow(p,false)).join(''),'دفعة',l=>`<span class="bx b-ok">${money(l.reduce((a,p)=>a+num(p.amount),0))}</span>`):`<div class="card empty">لا توجد دفعات</div>`;
  return `<div class="btns" style="margin-bottom:10px"><button class="btn sm" data-act="closeStudent">→ كل الطلاب</button></div>
  <div class="btns" style="margin-bottom:12px"><button class="btn pri" data-act="addSession" data-sid="${id}">+ حصة</button><button class="btn pri" data-act="addPayment" data-sid="${id}">+ دفعة</button><button class="btn" data-act="report" data-id="${id}">📄 تقرير</button></div>
  ${dd('sp|info|'+id,'بيانات الطالب',null,info)}
  ${dd('sp|fin|'+id,'الملخص المالي',null,fin)}
  ${dd('sp|cal|'+id,'التقويم',null,calHtml(id))}
  ${dd('ss|'+id,'الحصص',sess.length+' حصة',sessByMonth(sess,id))}
  ${dd('sp|pay|'+id,'الدفعات',pays.length+' دفعة',payBody)}`;
}

function payRow(p,showStu=true){
  const s=stu(p.studentId);
  return `<div class="card row end" style="margin-bottom:8px"><div><b>${money(p.amount)}</b>${showStu?` · ${esc(s?s.name:'—')}`:''}<div class="muted">${fmtDate(p.date)}${p.method?' · '+esc(p.method):''}${p.note?' · '+esc(p.note):''}</div></div>
   <button class="btn sm bad" data-act="delPayment" data-id="${p.id}">حذف</button></div>`;
}

function viewIncome(){
  const m=S.month;
  const pays=db.payments.filter(p=>p.date.slice(0,7)===m).sort((a,b)=>b.date.localeCompare(a.date));
  const done=db.sessions.filter(x=>x.status==='done'&&x.date.slice(0,7)===m);
  const mins=done.reduce((a,x)=>a+num(x.duration),0);
  const months=[];for(let i=5;i>=0;i--)months.push(shiftMonth(m,-i));
  const vals=months.map(sumPaid),mx=Math.max(...vals,1);
  const per=db.students.map(s=>({s,paid:db.payments.filter(p=>p.studentId===s.id&&p.date.slice(0,7)===m).reduce((a,p)=>a+num(p.amount),0),ch:done.filter(x=>x.studentId===s.id).reduce((a,x)=>a+num(x.price),0),n:done.filter(x=>x.studentId===s.id).length})).filter(o=>o.paid||o.ch);
  const tiles=`<div class="grid g4">
   <div class="stat hl"><div class="l">المستلم</div><div class="v">${money(sumPaid(m))}</div></div>
   <div class="stat"><div class="l">قيمة الحصص المنجزة</div><div class="v">${money(sumCharged(m))}</div></div>
   <div class="stat"><div class="l">عدد الحصص</div><div class="v">${done.length}</div></div>
   <div class="stat"><div class="l">ساعات التدريس</div><div class="v">${(mins/60).toLocaleString('en-US',{maximumFractionDigits:1})}</div></div>
  </div>`;
  const chart=`<div class="card"><div class="bars">${months.map((mm,i)=>`<div class="bar ${mm===m?'cur':''}"><span>${vals[i]?Math.round(vals[i]).toLocaleString('en-US'):''}</span><div style="height:${Math.max(vals[i]/mx*80,2)}%"></div><span>${MONTHS[Number(mm.slice(5))-1]}</span></div>`).join('')}</div></div>`;
  const perT=`<div class="card"><table><tr><th>الطالب</th><th>حصص</th><th>قيمتها</th><th>المستلم</th></tr>${per.map(o=>`<tr><td>${esc(o.s.name)}</td><td>${o.n}</td><td>${money(o.ch)}</td><td>${money(o.paid)}</td></tr>`).join('')}</table></div>`;
  return `<h2>الدخل</h2>
  <div class="mnav"><button class="btn sm" data-act="month" data-n="-1">→ السابق</button><b>${monthLabel(m)}</b><button class="btn sm" data-act="month" data-n="1">التالي ←</button></div>
  <div class="btns" style="margin-bottom:12px"><button class="btn sm pri" data-act="addPayment">+ دفعة</button></div>
  ${dd('inc|sum','ملخص '+monthLabel(m),null,tiles)}
  ${dd('inc|chart','آخر 6 أشهر (المستلم)',null,chart)}
  ${per.length?dd('inc|per','حسب الطالب',per.length+' طالب',perT):''}
  ${dd('inc|pay','الدفعات',pays.length+' دفعة',pays.map(p=>payRow(p)).join('')||`<div class="card empty">لا توجد دفعات في هذا الشهر</div>`)}`;
}

     <div class="btns" style="flex-direction:column">

    <div><label>الشقة</label><input name="apt" value="${val(s.apt)}"></div></div>
   </div>
   <label>ملاحظات</label><textarea name="notes" rows="2">${val(s.notes)}</textarea>
   <button class="btn pri block" style="margin-top:14px">حفظ</button></form>`);
}
const studentOptions=sel=>db.students.filter(s=>!isArch(s)||s.id===sel).map(s=>`<option value="${s.id}" data-price="${val(s.price)}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('');
function openSessionForm(id,sid){
  if(!db.students.length){toast('أضف طالبًا أولاً');return}
  const x=id?db.sessions.find(y=>y.id===id):{studentId:sid||S.sStudent||db.students[0].id,date:today(),time:'16:00',duration:60,status:'scheduled'};
  const s0=stu(x.studentId);
  if(!id)x.price=s0?s0.price:'';
  modal(id?'تعديل الحصة':'حصة جديدة',`<form data-form="session" data-id="${id||''}">
   <label>الطالب</label><select name="studentId" id="fStu">${studentOptions(x.studentId)}</select>
   <div class="two"><div><label>التاريخ</label><input type="date" name="date" required value="${x.date}"></div>
   <div><label>الوقت</label><input type="time" name="time" required value="${x.time}"></div></div>
   <div class="two"><div><label>المدة (دقيقة)</label><input name="duration" inputmode="numeric" value="${x.duration}"></div>
   <div><label>سعر الحصة</label><input name="price" id="fPrice" inputmode="decimal" value="${val(x.price)}"></div></div>
   <label>موضوع الحصة</label><input name="topic" value="${val(x.topic)}" placeholder="مثال: التفاضل - قاعدة السلسلة">
   <label>الحالة</label><select name="status">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${x.status===k?'selected':''}>${v}</option>`).join('')}</select>
   ${id?'':`<label>تكرار أسبوعي (عدد الأسابيع)</label><input name="repeat" inputmode="numeric" value="1">`}
   <button class="btn pri block" style="margin-top:14px">حفظ</button></form>`);
}
function openPaymentForm(sid){
  if(!db.students.length){toast('أضف طالبًا أولاً');return}
  const first=sid||S.studentId||db.students[0].id;
  const b=stats(first).balance;
  modal('دفعة جديدة',`<form data-form="payment">
   <label>الطالب</label><select name="studentId" id="pStu">${studentOptions(first)}</select>
   <div class="two"><div><label>المبلغ</label><input name="amount" id="pAmt" required inputmode="decimal" value="${b>0?b:''}"></div>
   <div><label>التاريخ</label><input type="date" name="date" required value="${today()}"></div></div>
   <label>طريقة الدفع</label><select name="method"><option>نقدًا</option><option>تحويل بنكي</option><option>أخرى</option></select>
   <label>ملاحظة</label><input name="note">
   <button class="btn pri block" style="margin-top:14px">حفظ</button></form>`);
}

function pdfFromJpeg(jpg,w,h){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  add('%PDF-1.4\n');
  const obj=(n,body)=>{offs[n]=len;add(`${n} 0 obj\n${body}\nendobj\n`)};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offs[4]=len;add(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);add(jpg);add('\nendstream\nendobj\n');
  const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  obj(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  const xr=len;let x='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(x+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function saveBlob(blob,fname){
  const file=new File([blob],fname,{type:blob.type});
  if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:fname});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
const repName=()=>('تقرير-'+REP.name+'-'+today()).replace(/[\\/:*?"<>|]+/g,'-');

const FORMS={
  user(d,id){
    const name=d.name.trim();if(!name)return;
    if(id){const u=users.find(x=>x.id===id);u.name=name;u.currency=d.currency.trim();u.phone=(d.phone||'').trim()}
    else{const u={id:uid(),name,currency:d.currency.trim(),phone:(d.phone||'').trim(),color:COLORS[users.length%COLORS.length]};users.push(u);ls.set(dataKey(u.id),JSON.stringify(emptyDb()));
      if(!curId){curId=u.id;ls.set(K_CUR,curId);db=emptyDb();S.view='dash'}}
    saveUsers();closeModal();render();
  },
  student(d,id){
    const o={name:d.name.trim(),stage:d.stage,grade:d.grade,ltype:d.ltype,subject:d.subject,price:num(d.price),phone:d.phone.trim(),rel:d.rel,parentPhone:d.parentPhone.trim(),

    if(id)Object.assign(stu(id),o);else db.students.push({id:uid(),...o});
    save();closeModal();render();
  },
  session(d,id){
    const b={studentId:d.studentId,time:d.time,duration:num(d.duration)||60,price:num(d.price),topic:d.topic.trim(),status:d.status};
    if(id)Object.assign(db.sessions.find(x=>x.id===id),b,{date:d.date});
    else{const n=Math.max(1,Math.min(52,Math.floor(num(d.repeat))||1));
      for(let i=0;i<n;i++)db.sessions.push({id:uid(),...b,date:addDays(d.date,7*i),status:i?'scheduled':b.status})}
    save();closeModal();render();toast('تم الحفظ');
  },
  payment(d){
    const amt=num(d.amount);if(amt<=0){toast('أدخل مبلغًا صحيحًا');return}
    db.payments.push({id:uid(),studentId:d.studentId,amount:amt,date:d.date,method:d.method,note:d.note.trim()});

  }

  const t=e.target.closest('[data-act]');if(!t)return;

  const t=e.target;

      const j=JSON.parse(r.result);if(!j.data||!Array.isArray(j.data.students))throw 0;

document.addEventListener('input',e=>{
  if(e.target.id==='q'){const q=e.target.value.trim();document.querySelectorAll('#slist [data-name],#alist [data-name]').forEach(c=>c.classList.toggle('hide',q&&!c.dataset.name.includes(q)))}

init();
